# cpplint settings for experimental/redline. The code uses the V8 style
# (`git cl format`). The rules below turn off two cpplint checks that do not fit
# a standalone tool:
#   build/c++11: Redline is a standalone executable and uses std::thread,
#     std::mutex and <chrono> directly;
#   runtime/int: `static_cast<unsigned long long>` for printf("%llu").
filter=-build/c++11,-runtime/int
