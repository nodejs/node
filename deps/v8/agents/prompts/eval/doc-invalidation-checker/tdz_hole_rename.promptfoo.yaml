description: >-
  Verify doc-invalidation-checker updates both docs/parsing/hole-checks-optimized.md
  and docs/parsing/hole-check-elision.md when ValueNode::IsTdzHole() is renamed
  to ValueNode::CanElideTdzHoleCheck() in src/maglev/.
owner: leszeks@chromium.org
prompts:
  - 'file://prompt.md'
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 600
      skills:
        - doc-invalidation-checker
      changes:
        - apply: >-
            agents/prompts/eval/doc-invalidation-checker/tdz_hole_rename.patch
tests:
  - assert:
      - type: python
        value: >-
          file://../../../testing/asserts/check_changes.py:check_files_changed
        config:
          files:
            - docs/parsing/hole-checks-optimized.md
            - docs/parsing/hole-check-elision.md
      - type: python
        value: >-
          file://../../../skills/doc-invalidation-checker/scripts/eval_doc_checker.py:check_files_unchanged
        config:
          files:
            - docs/security/triaging.md
      - type: python
        value: >-
          file://../../../testing/asserts/check_changes.py:check_file_content
        config:
          files:
            - path: docs/parsing/hole-checks-optimized.md
              present:
                - 'value->CanElideTdzHoleCheck()'
              absent:
                - 'value->IsTdzHole()'
            - path: docs/parsing/hole-check-elision.md
              present:
                - 'ValueNode::CanElideTdzHoleCheck()'
              absent:
                - 'ValueNode::IsTdzHole()'
    metadata:
      category: positive-cross-tier-rename
      commit_message: |
        [maglev] Rename ValueNode::IsTdzHole to CanElideTdzHoleCheck

        Use ValueNode::CanElideTdzHoleCheck() in MaglevGraphBuilder and
        MaglevGraphOptimizer TDZ hole check visitors.
      tags:
        - docs
        - maglev
        - parsing
