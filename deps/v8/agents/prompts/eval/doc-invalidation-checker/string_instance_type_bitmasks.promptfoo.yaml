description: >-
  Verify doc-invalidation-checker updates docs/objects/strings.md when
  kUncachedExternalStringMask and kSharedStringMask bit positions change in
  src/objects/instance-type.h.
owner: leszeks@chromium.org
prompts:
  - 'file://prompt.md'
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 600
      skills:
        - doc-invalidation-checker
      changes:
        - apply: >-
            agents/prompts/eval/doc-invalidation-checker/string_instance_type_bitmasks.patch
tests:
  - assert:
      - type: python
        value: >-
          file://../../../testing/asserts/check_changes.py:check_files_changed
        config:
          files:
            - docs/objects/strings.md
      - type: python
        value: >-
          file://../../../skills/doc-invalidation-checker/scripts/eval_doc_checker.py:check_files_unchanged
        config:
          files:
            - docs/security/triaging.md
      - type: python
        value: >-
          file://../../../testing/asserts/check_changes.py:check_file_content
        config:
          files:
            - path: docs/objects/strings.md
              present:
                - 'kSharedStringMask = 1 << 4'
                - 'kUncachedExternalStringMask = 1 << 5'
              absent:
                - 'kUncachedExternalStringMask = 1 << 4'
                - 'kSharedStringMask = 1 << 5'
    metadata:
      category: positive-bitfield-layout
      commit_message: |
        [objects] Swap kSharedStringMask (bit 4) and kUncachedExternalStringMask (bit 5)

        Move kSharedStringMask to bit 4 and kUncachedExternalStringMask to
        bit 5 in String InstanceType.
      tags:
        - docs
        - objects
