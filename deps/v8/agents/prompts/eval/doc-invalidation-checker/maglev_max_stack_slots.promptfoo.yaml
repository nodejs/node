description: >-
  Verify doc-invalidation-checker updates docs/compiler/maglev/compiler-maglev.md
  when Maglev's kMaxStackSlots constant changes in src/maglev/maglev-compiler.cc.
owner: leszeks@chromium.org
prompts:
  - 'file://prompt.md'
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 600
      skills:
        - doc-invalidation-checker
      changes:
        - apply: >-
            agents/prompts/eval/doc-invalidation-checker/maglev_max_stack_slots.patch
tests:
  - assert:
      - type: python
        value: >-
          file://../../../testing/asserts/check_changes.py:check_files_changed
        config:
          files:
            - docs/compiler/maglev/compiler-maglev.md
      - type: python
        value: >-
          file://../../../skills/doc-invalidation-checker/scripts/eval_doc_checker.py:check_files_unchanged
        config:
          files:
            - docs/security/triaging.md
      - type: python
        value: >-
          file://../../../testing/asserts/check_changes.py:check_file_content
        config:
          files:
            - path: docs/compiler/maglev/compiler-maglev.md
              present:
                - '8 * KB / kSystemPointerSize'
                - '1024'
              absent:
                - '4 * KB / kSystemPointerSize'
    metadata:
      category: positive-constant-invariant
      commit_message: |
        [maglev] Raise kMaxStackSlots limit to 8 KB

        Allow Maglev frames up to 8 KB (1024 stack slots on 64-bit) before
        bailing out of compilation.
      tags:
        - docs
        - maglev
