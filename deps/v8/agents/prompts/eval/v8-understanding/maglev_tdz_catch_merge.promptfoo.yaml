description: >-
  Verify v8-understanding helps locate and restore Maglev KnownNodeAspects
  context slot cache preservation across TDZ hole check exception handler merges
  in both MaglevGraphBuilder and KnownNodeAspectsProcessor.
owner: leszeks@chromium.org
prompts:
  - >-
    Investigate and fix a Maglev bug with immutable (`const`) lexical variable
    TDZ hole checks inside `try`/`catch` blocks (the "Inverted Generator"
    pattern). When a TDZ check inside a `try` block throws into a local `catch`
    handler that resumes a generator to initialize the `const` variable,
    Maglev's `KnownNodeAspects` immutable context slot cache propagates the
    pre-throw uninitialized context load into the `catch` handler merge (both
    during initial graph building and during the post-graph KNA recomputation
    pass) and reuses the stale TDZ hole value in the `catch` block instead of
    reloading the newly initialized value. Fix the bug in `src/` (skip C++
    compilation and test execution).
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 600
      skills:
        - v8-understanding
      changes:
        - apply: >-
            agents/prompts/eval/v8-understanding/maglev_tdz_catch_merge.patch
tests:
  - assert:
      - type: python
        value: >-
          file://../../../testing/asserts/check_changes.py:check_files_changed
        config:
          files:
            - src/maglev/maglev-graph-builder.cc
            - src/maglev/maglev-kna-processor.h
      - type: python
        value: >-
          file://../../../testing/asserts/check_changes.py:check_file_content
        config:
          files:
            - path: src/maglev/maglev-graph-builder.cc
              present:
                - 'LoadContextSlotNoCells'
                - 'GetContextCachedValue'
            - path: src/maglev/maglev-kna-processor.h
              present:
                - 'LoadContextSlotNoCells'
                - 'GetContextCachedValue'
    metadata:
      category: maglev-tdz-kna
      tags:
        - docs
        - maglev
        - parsing
