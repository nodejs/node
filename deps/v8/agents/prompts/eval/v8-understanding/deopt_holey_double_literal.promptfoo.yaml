description: >-
  Verify v8-understanding helps locate and restore distinct HOLEY_DOUBLE_LITERAL
  deoptimization frame translation encoding across all three optimizing compiler
  backends (TurboFan/Turboshaft CodeGenerator, TurbolevGraphBuilder, and Maglev).
owner: leszeks@chromium.org
prompts:
  - >-
    Investigate and fix a deoptimization bug with constant-folded holey double
    values (`kHoleNanInt64` / `HoleyFloat64`) across V8's optimizing compilers.
    Currently, constant-folded `HoleyFloat64` literals in deoptimization frame
    translations (including virtual object fields) are emitted using the plain
    `DOUBLE_LITERAL` translation opcode instead of `HOLEY_DOUBLE_LITERAL`,
    causing deoptimization to materialize a `HeapNumber` containing the raw hole
    NaN bit pattern instead of `undefined` when unboxing to tagged values.
    Identify all optimizing compiler frame translation producers that
    distinguish `HoleyFloat64` from `Float64` constants, and fix all of them in
    `src/` (skip C++ compilation and test execution).
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 600
      skills:
        - v8-understanding
      changes:
        - apply: >-
            agents/prompts/eval/v8-understanding/deopt_holey_double_literal.patch
tests:
  - assert:
      - type: python
        value: >-
          file://../../../testing/asserts/check_changes.py:check_files_changed
        config:
          files:
            - src/compiler/backend/code-generator.cc
            - src/compiler/turboshaft/turbolev-graph-builder.cc
            - src/maglev/maglev-code-generator.cc
      - type: python
        value: >-
          file://../../../testing/asserts/check_changes.py:check_file_content
        config:
          files:
            - path: src/compiler/backend/code-generator.cc
              present:
                - 'StoreHoleyDoubleLiteral'
            - path: src/compiler/turboshaft/turbolev-graph-builder.cc
              present:
                - 'MachineType::HoleyFloat64()'
            - path: src/maglev/maglev-code-generator.cc
              present:
                - 'StoreHoleyDoubleLiteral'
    metadata:
      category: deopt-holey-float64
      tags:
        - docs
        - deopt
        - maglev
        - turboshaft
