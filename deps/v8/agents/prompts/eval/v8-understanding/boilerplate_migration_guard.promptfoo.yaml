description: >-
  Verify v8-understanding helps locate and restore the background compilation
  BoilerplateMigrationGuardIfNeeded scope in both TurboFan JSCreateLowering and
  Maglev fast literal boilerplate traversal.
owner: leszeks@chromium.org
prompts:
  - >-
    Investigate and fix a background compilation data race when reading
    `AllocationSite` boilerplates for fast object/array literals. When the main
    thread migrates a boilerplate object in place while a background compilation
    thread is reading its fields to inline fast literal allocation, the
    background compiler can observe an inconsistent in-flight migration state
    because the recursive boilerplate reader is missing its migration lock guard
    on the outer boilerplate traversal in both TurboFan and Maglev. Restore the
    guard in both compilers in `src/` (skip C++ compilation and test execution).
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 600
      skills:
        - v8-understanding
      changes:
        - apply: >-
            agents/prompts/eval/v8-understanding/boilerplate_migration_guard.patch
tests:
  - assert:
      - type: python
        value: >-
          file://../../../testing/asserts/check_changes.py:check_files_changed
        config:
          files:
            - src/compiler/js-create-lowering.cc
            - src/maglev/maglev-graph-builder.cc
      - type: python
        value: >-
          file://../../../testing/asserts/check_changes.py:check_file_content
        config:
          files:
            - path: src/compiler/js-create-lowering.cc
              present:
                - 'BoilerplateMigrationGuardIfNeeded'
            - path: src/maglev/maglev-graph-builder.cc
              present:
                - 'BoilerplateMigrationGuardIfNeeded'
    metadata:
      category: background-compilation-concurrency
      tags:
        - docs
        - compiler
        - maglev
        - concurrency
