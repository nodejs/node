name: Node.js daily job

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *

env:
  NODE_VERSION: lts/*

permissions:
  contents: read

jobs:
  build-lto:
    if: github.repository == 'nodejs/node' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build lto
        run: |
          sudo apt-get update && sudo apt-get install ninja-build -y
          ./configure --enable-lto --ninja
          ninja -C out/Release

  # Once main builds, tell nodejs/devcontainer to publish new nightly images from the same commit.
  # Its build workflow listens for this `node-daily` event.
  trigger-devcontainer:
    needs: build-lto
    if: github.repository == 'nodejs/node' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    steps:
      - name: Dispatch a nodejs/devcontainer build
        run: |
          gh api repos/nodejs/devcontainer/dispatches \
            -f event_type=node-daily \
            -f "client_payload[sha]=$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GH_USER_TOKEN }}
